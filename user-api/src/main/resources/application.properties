# =====================================================================
# alyak-user-api 설정
#  - ${환경변수:기본값} 형식. 값은 docker run 의 -e 옵션으로 넘긴다.
#  - 비밀값(DB 비밀번호, CODEF 키)은 이미지·코드에 넣지 않는다. docker run --env-file env/user-api.env 로 실행할 때만 전달한다.
#  - DB_PASSWORD 는 기본값이 없다. 빠뜨리면 서버가 DB 에 접속하지 못하고 바로 실패한다.
# =====================================================================
spring.application.name=alyak-user-api

# 컨테이너 내부 포트 (호스트에는 노출하지 않고 alyak-proxy 만 이 포트로 접근)
server.port=8080

# ---------------------------------------------------------------------
# DB : alyak-mysql 컨테이너의 alyak_user 스키마 (user-api 전용 계정 사용)
#  - 호스트 이름 alyak-mysql 은 도커 네트워크(alyak-net)의 내장 DNS 가 컨테이너 IP 로 바꿔 준다
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://alyak-mysql:3306/alyak_user?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:alyak_user_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 테이블은 db/initdb 의 SQL 이 만든다. JPA 는 엔티티와 테이블이 맞는지 "검사"만 한다.
#  (서버 2대가 동시에 떠도 테이블을 만들거나 바꾸려고 경쟁하지 않도록)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# DB 가 아직 준비 중일 때 서버가 바로 죽지 않도록 커넥션 대기 시간을 넉넉히 둔다
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# ---------------------------------------------------------------------
# Redis : alyak-redis 컨테이너 (세션 저장소)
#  세션 관련 세부 설정(namespace, 직렬화, 쿠키)은 global/config/SessionConfig.java 에 있다.
# ---------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:alyak-redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------------------------------------------------------------------
# JSON 형식 : 응답·요청의 필드 이름을 snake_case 로 통일 (예: servedBy → served_by)
#  파이썬(FastAPI) 서버와 같은 형식을 쓰기 위함
# ---------------------------------------------------------------------
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.time-zone=Asia/Seoul

# ---------------------------------------------------------------------
# CODEF (간편인증 + 심평원 처방내역 조회)
#  - 키를 하나라도 비워 두면 서버가 자동으로 "모의(MOCK) 모드"로 동작해서
#    실제 인증 없이 샘플 처방내역을 돌려준다. (키가 없는 사람도 기능을 재현할 수 있게)
#  - service-type : DEMO(데모 키, 실데이터) / API(정식) / SANDBOX(고정 샘플)
# ---------------------------------------------------------------------
codef.service-type=${CODEF_SERVICE_TYPE:DEMO}
codef.client-id=${CODEF_CLIENT_ID:}
codef.client-secret=${CODEF_CLIENT_SECRET:}
codef.public-key=${CODEF_PUBLIC_KEY:}

# ---------------------------------------------------------------------
# 관리자 계정 : 서버가 뜰 때 이 이메일의 계정이 없으면 ADMIN 권한으로 만든다 (AdminAccountInitializer)
#  값은 env/user-api.env 에서만 받는다 (비밀번호를 코드·git 에 두지 않기 위해)
# ---------------------------------------------------------------------
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# 처방내역 불러오기 횟수 제한 : 계정당 하루 최대 N번 (실제 CODEF 호출만 센다. 과도한 호출 시 비용·IP 차단 우려)
#  env/user-api.env 에 PRESCRIPTION_IMPORT_MAX_PER_DAY 를 넣으면 바꿀 수 있다 (기본 5)
prescription-import.max-per-day=${PRESCRIPTION_IMPORT_MAX_PER_DAY:5}
