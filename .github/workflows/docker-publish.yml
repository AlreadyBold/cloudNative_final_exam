# =====================================================================
# docker-publish.yml : 이미지 5개를 amd64(x86) 용으로 빌드해서 Docker Hub 에 올린다
#
# - 과제 조건 : "MAC은 amd64 cpu 빌드, arm cpu 빌드 하지 말것" (채점·실행 환경이 일반 PC / x86 서버)
# - 개발 VM은 맥(M칩) 위의 arm64 라서, 직접 빌드하면 arm64 이미지가 되고 amd64 는 에뮬레이션이라 느리고 디스크도 부족하다.
#   그래서 GitHub 이 제공하는 amd64 빌드 머신(ubuntu-24.04)에서 빌드한다. (빌드 명령은 scripts/02_build.sh 와 같다)
# - 수동 실행만 한다 : GitHub 레포 → Actions → "Docker Hub 이미지 올리기" → Run workflow
#
# 미리 필요한 것 (레포 Settings → Secrets and variables → Actions)
#   DOCKERHUB_USERNAME : Docker Hub 아이디
#   DOCKERHUB_TOKEN    : Docker Hub 액세스 토큰 (Account settings → Personal access tokens, Read & Write)
# =====================================================================
name: Docker Hub 이미지 올리기

on:
  workflow_dispatch:   # 버튼을 눌렀을 때만 실행 (커밋할 때마다 자동으로 올리지 않는다)

permissions:
  contents: read       # 소스를 읽기만 한다

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # 이미지 하나가 실패해도 나머지는 계속 빌드한다
      matrix:
        # 이미지마다 "이름, Dockerfile, 빌드 컨텍스트(폴더)" (scripts/02_build.sh 의 docker build 명령과 같은 조합)
        include:
          - name: alyak-mysql
            dockerfile: db/Dockerfile.mysql
            context: db
          - name: alyak-user-api
            dockerfile: user-api/Dockerfile.user-api
            context: user-api
          - name: alyak-pill-api
            dockerfile: pill-api/Dockerfile.pill-api
            context: pill-api
          - name: alyak-front
            dockerfile: front/Dockerfile.front
            context: front
          - name: alyak-proxy
            dockerfile: proxy/Dockerfile.proxy
            context: proxy

    steps:
      # 1) 레포 소스 받기
      - name: 소스 받기
        uses: actions/checkout@v4

      # 2) Buildx : 플랫폼(--platform)을 지정해서 빌드하고 바로 올릴 수 있는 docker build 확장
      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # 3) Docker Hub 로그인 (비밀값은 레포 Secrets 에서만 읽고, 로그에는 가려져 나온다)
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4) 빌드하고 바로 Docker Hub 에 올리기 (빌드 머신이 amd64 라서 에뮬레이션 없이 빌드된다)
      #    = docker buildx build --platform linux/amd64 -f <dockerfile> -t junheong/<name>:1.0 --push <context>
      - name: ${{ matrix.name }} 빌드·올리기
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: junheong/${{ matrix.name }}:1.0
          push: true
          # 빌드 출처 증명서(provenance)를 붙이지 않는다 : 붙이면 Docker Hub 에 "unknown/unknown" 항목이 함께 보여서
          # amd64 이미지 하나만 올라간 것이 헷갈려 보인다
          provenance: false
