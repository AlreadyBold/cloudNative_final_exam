# =====================================================================
# alyak-proxy 설정 : 역방향 프록시 (nginx)
#
#  브라우저는 이 프록시 하나(http://<VM IP>:8080)만 알고, 실제 서버 위치는 모른다.
#  주소(경로)를 보고 알맞은 컨테이너로 요청을 넘긴다.
#
#    /api/user/**  →  alyak-user-api-1:8080, alyak-user-api-2:8080  (번갈아 분산, Spring Boot)
#    /api/pill/**  →  alyak-pill-api:8000                            (FastAPI)
#    그 밖 (/)     →  alyak-front:80                                 (정적 HTML/JS)
#
#  모든 요청이 같은 주소(같은 출처)로 오므로 브라우저는 SESSION 쿠키를 세 서버 모두에 똑같이 보낸다.
#  → 어느 서버가 받아도 Redis 의 같은 세션을 읽게 되어 로그인이 유지된다.
#
#  컨테이너 이름(alyak-user-api-1 등)은 도커 네트워크(alyak-net)의 내장 DNS 가 IP 로 바꿔 준다.
# =====================================================================

# ---------------------------------------------------------------------
# 컨테이너 IP 를 주기적으로 다시 확인하기
#  nginx 는 기본적으로 "시작할 때 한 번만" 이름을 IP 로 바꿔 기억한다.
#  그래서 user-api 등을 지우고 다시 만들어 IP 가 바뀌면 옛 IP 로 보내다가 실패한다 (Connection refused).
#  resolver : 도커 내장 DNS(127.0.0.11, 사용자 정의 네트워크에서만 동작)에 10초마다 다시 물어본다.
#  ipv6=off : 도커 DNS 에 IPv6 주소를 묻지 않는다.
#  아래 upstream 의 zone(공유 메모리)과 server ... resolve 가 함께 있어야 동작한다 (nginx 1.27.3 이상).
# ---------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

# ---------------------------------------------------------------------
# upstream : 요청을 나눠 줄 서버 묶음
#  기본 방식은 라운드 로빈(1번 → 2번 → 1번 ...)이라 user-api 2대가 요청을 번갈아 받는다.
#  세션이 Redis 에 있으므로 "같은 사용자는 같은 서버로" 같은 고정(sticky) 설정이 필요 없다.
# ---------------------------------------------------------------------
upstream user_api {
    zone user_api 64k;   # 다시 확인한 IP 를 저장할 공유 메모리
    server alyak-user-api-1:8080 resolve;
    server alyak-user-api-2:8080 resolve;
}

upstream pill_api {
    zone pill_api 64k;
    server alyak-pill-api:8000 resolve;
}

upstream front {
    zone front 64k;
    server alyak-front:80 resolve;
}

server {
    # 컨테이너 안에서는 80 번으로 받는다 (호스트의 8080 번과 docker run -p 8080:80 으로 연결)
    listen 80;
    server_name _;

    # 응답 헤더에 nginx 버전을 숨긴다 (불필요한 정보 노출 방지)
    server_tokens off;

    # 뒤쪽 서버에 "원래 요청 정보"를 함께 넘긴다
    #  Host              : 브라우저가 접속한 주소
    #  X-Real-IP         : 실제 사용자 IP (서버 입장에서는 프록시 IP 만 보이므로)
    #  X-Forwarded-For   : 거쳐 온 IP 목록
    #  X-Forwarded-Proto : http / https
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 어느 서버로 보냈는지 응답 헤더에 남긴다 (예: 172.18.0.5:8080). 서버가 붙이는 X-Served-By 와 함께 보면 분산을 확인할 수 있다
    add_header X-Upstream-Addr $upstream_addr always;

    # ----- 회원 서버 (Spring Boot 2대) -----
    location /api/user/ {
        proxy_pass http://user_api;
        # 처방내역 불러오기는 CODEF 응답을 기다리느라 수십 초 이상 걸릴 수 있다 (CODEF 제한 300초 + 여유)
        proxy_read_timeout 320s;
    }

    # ----- 약 서버 (FastAPI) -----
    location /api/pill/ {
        proxy_pass http://pill_api;
    }

    # ----- 프론트 (정적 파일) -----
    location / {
        proxy_pass http://front;
    }
}
