# =====================================================================
# alyak-front 설정 : 정적 파일(HTML/CSS/JS)만 내려 주는 웹 서버 (nginx)
#  API 요청은 이 컨테이너로 오지 않는다. alyak-proxy 가 /api/** 를 각 서버로 바로 보낸다.
# =====================================================================
server {
    listen 80;
    server_name _;
    server_tokens off;

    # 이미지 안에 COPY 한 프론트 파일 위치
    root /usr/share/nginx/html;
    index index.html;

    # 화면은 index.html 하나(탭으로 화면 전환)라서, 없는 주소도 index.html 로 보낸다
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 개발 중 수정한 JS/CSS 가 브라우저 캐시 때문에 안 바뀌어 보이지 않도록 매번 새로 확인하게 한다
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
    }
}
